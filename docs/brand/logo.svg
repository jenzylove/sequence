<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Sequence: one settlement leads to the next trade.
       Cyan is the market being watched, violet the follow-on it triggers, and
       the arrow between them is the rule that carries it. The arrow stops short
       of the second dot so the head stays readable at tile size. -->
  <rect width="480" height="480" rx="104" fill="#ffffff"/>
  <rect x="1.5" y="1.5" width="477" height="477" rx="102.5" fill="none" stroke="#ECE9EF" stroke-width="3"/>

  <line x1="201" y1="209" x2="248" y2="250"
        stroke="#4B4650" stroke-width="13" stroke-linecap="round"/>
  <polygon points="274,272 240,268 259,241" fill="#4B4650"/>

  <circle cx="150" cy="164" r="62" fill="#50D6ED"/>
  <circle cx="322" cy="316" r="62" fill="#9B7BFF"/>
</svg>
