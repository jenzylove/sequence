name: contracts

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'app/web/scripts/deploy-shared-manager.mjs'
      - 'app/web/scripts/chained-reactivity-live.mjs'
      - 'foundry.toml'
      - 'remappings.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'app/web/scripts/deploy-shared-manager.mjs'
      - 'app/web/scripts/chained-reactivity-live.mjs'
      - 'foundry.toml'
      - 'remappings.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install Solidity dependencies
        run: |
          npm ci
          forge install foundry-rs/forge-std --no-commit
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv
      - name: Syntax-check final Reactivity commands
        run: |
          node --check app/web/scripts/deploy-shared-manager.mjs
          node --check app/web/scripts/chained-reactivity-live.mjs
